<div class="auth-page-container">
  <mat-card class="auth-card">
    <mat-card-header class="auth-header">
      <mat-icon class="brand-icon">lock_reset</mat-icon>
      <mat-card-title>Reset Password</mat-card-title>
      <mat-card-subtitle>Enter your email and a new password</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="alert-box error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert-box success" *ngIf="successMessage">{{ successMessage }}</div>

      <form [formGroup]="forgotForm" (ngSubmit)="onResetPassword()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Registered Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="name@company.com">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>New Password</mat-label>
          <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword">
          <button mat-icon-button matSuffix type="button" (click)="toggleNewPassword()">
            <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm New Password</mat-label>
          <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword">
          <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPassword()">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="warn" class="full-width submit-btn" type="submit" [disabled]="forgotForm.invalid">
          Update Password
        </button>
      </form>

      <div class="footer-link">
        Remembered your password? <a routerLink="/login">Sign In</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
